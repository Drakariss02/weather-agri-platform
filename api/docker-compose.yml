version: "3.8"
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: agri_user
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: agri
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  backend:
    build: .
    depends_on:
      - db
    environment:
      DATABASE_URL: "postgresql://agri_user:changeme@db:5432/agri"
    ports:
      - "8000:8000"
    restart: on-failure
    volumes:
      - .:/api
      - ./models:/api/models

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin   
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  db_data:
